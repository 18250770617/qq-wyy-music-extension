<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>CloudMusic Edge UI Harness</title><style>body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e9edf5,#c6cfde);font:16px system-ui;color:#263044}.demo{max-width:720px;margin:12vh auto;padding:38px;border-radius:28px;background:#ffffffb0;box-shadow:0 30px 80px #42516b25}.demo h1{font-size:42px;margin:0 0 12px}.demo p{line-height:1.8;color:#667085}</style></head>
<body><section class="demo"><h1>UI 验证页面</h1><p>用于检查 CloudMusic Edge 悬浮球的吸附、展开和搜索卡片。这里不会连接真实音乐账号。</p></section>
<script>
  const state={provider:"netease",floatingAppearance:{theme:"obsidian",opacity:96,font:"modern",size:100,dockEnabled:true,dockHeight:112}};
  if(!crypto.randomUUID) crypto.randomUUID=()=>"11111111-1111-4111-8111-111111111111";
  globalThis.chrome={storage:{local:{get:(defaults,cb)=>cb({...defaults,...state}),set:(value)=>Object.assign(state,value)}},runtime:{sendMessage:async(message)=>{
    if(message.action==="netease.control") return {ok:true,data:{payload:{state:{status:"playing",position:24,duration:264,volume:50,title:"Fade",meta:"Alan Walker",queueLength:12}}}};
    if(message.action==="netease.library") return {ok:true,data:{payload:{data:message.payload.kind==="favorite"?{name:"我喜欢的音乐",id:"CED6453C885522F2FAFD0F2D7F2E2DC1",originalId:7686123390,trackCount:887}:{records:[{name:message.payload.kind==="created"?"夜间驾驶":"电影配乐收藏",id:"D374329FEAF49C2A6B1D17A7DCADA717",originalId:18128658255,trackCount:56,creatorNickName:"CloudMusic"}]}}}};
    if(message.action==="netease.playlistTracks") return {ok:true,data:{payload:{data:[{name:"稻香",artists:[{name:"周杰伦"}],id:"0123456789abcdef0123456789abcdef",originalId:186016},{name:"夜曲",artists:[{name:"周杰伦"}],id:"abcdef0123456789abcdef0123456789",originalId:185868}]}}};
    if(message.action==="netease.visualizer") return {ok:true,data:message.payload.mode==="stop"?{available:false}:{available:true,bands:[-42,-36,-31,-24,-29,-18,-26,-33,-40,-48]}};
    if(message.action==="qq.playlistDetail") return {ok:true,data:{songTotalNum:2,songs:[{songName:"晴天",singerName:"周杰伦",songMid:"demo",songH5Url:"https://y.qq.com"},{songName:"夜曲",singerName:"周杰伦",songMid:"demo2",songH5Url:"https://y.qq.com"}]}};
    if(message.action?.endsWith(".search")) return {ok:true,data:message.action.startsWith("qq")?(message.payload.type==="playlist"?{playlists:[{dissName:"周杰伦精选",creatorName:"QQ 音乐",dissId:"123456",songCount:2}]}:{songs:[{songName:"晴天",singerName:"周杰伦",songMid:"demo",songH5Url:"https://y.qq.com"},{songName:"夜曲",singerName:"周杰伦",songMid:"demo2",songH5Url:"https://y.qq.com"}]}):message.payload.type==="playlist"?{payload:{playlists:[{name:"夜间驾驶",creatorNickName:"CloudMusic",trackCount:2,id:"D374329FEAF49C2A6B1D17A7DCADA717",originalId:"18128658255",visible:true}]}}:{payload:{songs:[{name:"晴天",artistName:"周杰伦",encryptedId:"0123456789abcdef0123456789abcdef",originalId:"186016",visible:true},{name:"夜曲",artistName:"周杰伦",encryptedId:"abcdef0123456789abcdef0123456789",originalId:"185868",visible:true}]}}};
    return {ok:true,data:{}};
  }}};
</script>
<script src="../extension/floating.js"></script>
</body></html>
