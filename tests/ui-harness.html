<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>CloudMusic Edge UI Harness</title><style>body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e9edf5,#c6cfde);font:16px system-ui;color:#263044}.demo{max-width:720px;margin:12vh auto;padding:38px;border-radius:28px;background:#ffffffb0;box-shadow:0 30px 80px #42516b25}.demo h1{font-size:42px;margin:0 0 12px}.demo p{line-height:1.8;color:#667085}</style></head>
<body><section class="demo"><h1>UI 验证页面</h1><p>用于检查 CloudMusic Edge 悬浮球的自由停放、边缘吸附、展开和搜索卡片。这里不会连接真实音乐账号。</p></section>
<script>
  const state={provider:"netease",floatingAppearance:{theme:"obsidian",opacity:96,font:"modern",size:100,dockEnabled:true,dockHeight:112}};
  let visualFrame=0;
  const demoTracks=Array.from({length:60},(_,index)=>({name:`测试歌曲 ${index+1}`,artists:[{name:`演示歌手 ${index%6+1}`}],id:(index+1).toString(16).padStart(32,"0"),originalId:10000+index,playFlag:true,visible:true}));
  let demoCollection=[
    {key:"netease:song:186016",provider:"netease",kind:"song",title:"晴天",meta:"周杰伦",encryptedId:"0123456789abcdef0123456789abcdef",originalId:"186016",availability:"playable",canPlay:true},
    {key:"netease:playlist:18128658255",provider:"netease",kind:"playlist",title:"夜间驾驶",meta:"CloudMusic · 60 首",encryptedId:"D374329FEAF49C2A6B1D17A7DCADA717",originalId:"18128658255",trackCount:60,availability:"playable",canPlay:true}
  ];
  let demoPlaylists=[{id:"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",name:"深夜专注",trackCount:2,createdAt:"2026-09-07T00:00:00Z",updatedAt:"2026-09-07T00:00:00Z",tracks:[]}];
  demoPlaylists[0].tracks=[demoCollection[0],{key:"qq:song:demo",provider:"qq",kind:"song",title:"QQ 示例歌曲",meta:"演示歌手",mid:"demo",url:"https://y.qq.com/n/ryqq/songDetail/demo",availability:"playable",canPlay:true}];
  demoTracks[2]={name:"无版权示例",artists:[{name:"演示歌手"}],id:"11111111111111111111111111111111",originalId:10002,playFlag:false,visible:false};
  if(!window.crypto) window.crypto={};
  if(!window.crypto.randomUUID) window.crypto.randomUUID=()=>"11111111-1111-4111-8111-111111111111";
  window.chrome={storage:{local:{get:(defaults,cb)=>cb({...defaults,...state}),set:(value)=>Object.assign(state,value)}},runtime:{sendMessage:async(message)=>{
    if(message.action==="collection.keys") return {ok:true,data:{keys:demoCollection.map(item=>item.key),recordCount:demoCollection.length}};
    if(message.action==="collection.list") { const matches=demoCollection.filter(item=>!message.payload.kind||item.kind===message.payload.kind); const offset=message.payload.offset||0; return {ok:true,data:{items:matches.slice(offset,offset+(message.payload.limit||60)),recordCount:matches.length,hasMore:false}}; }
    if(message.action==="collection.toggle") { const item=message.payload.item; const key=item.provider===			  "netease"?`${item.provider}:${item.kind}:${item.originalId}`:`${item.provider}:${item.kind}:${item.kind==="playlist"?item.playlistId:item.mid||item.url}`; const index=demoCollection.findIndex(entry=>entry.key===key); if(index>=0){demoCollection.splice(index,1);return {ok:true,data:{added:false,key,recordCount:demoCollection.length}};} demoCollection.unshift({...item,key});return {ok:true,data:{added:true,key,recordCount:demoCollection.length}}; }
    if(message.action==="collection.import") { let added=0; for(const item of message.payload.items){const key=`${item.provider}:${item.kind}:${item.originalId}`;if(!demoCollection.some(entry=>entry.key===key)){demoCollection.unshift({...item,key});added++;}} return {ok:true,data:{addedCount:added,recordCount:demoCollection.length}}; }
    if(message.action==="collection.playlists") return {ok:true,data:{playlists:demoPlaylists.map(({tracks,...playlist})=>({...playlist,trackCount:tracks.length})),recordCount:demoPlaylists.length}};
    if(message.action==="collection.createPlaylist") { const playlist={id:(demoPlaylists.length+1).toString(16).padStart(32,"0"),name:message.payload.name,trackCount:0,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),tracks:[]}; demoPlaylists.unshift(playlist); return {ok:true,data:{playlist,recordCount:demoPlaylists.length}}; }
    if(message.action==="collection.renamePlaylist") { const playlist=demoPlaylists.find(item=>item.id===message.payload.playlistId); playlist.name=message.payload.name; return {ok:true,data:{playlist:{...playlist,trackCount:playlist.tracks.length}}}; }
    if(message.action==="collection.deletePlaylist") { const index=demoPlaylists.findIndex(item=>item.id===message.payload.playlistId); const [playlist]=demoPlaylists.splice(index,1); return {ok:true,data:{deleted:true,id:playlist.id,name:playlist.name,recordCount:demoPlaylists.length}}; }
    if(message.action==="collection.addToPlaylist") { const playlist=demoPlaylists.find(item=>item.id===message.payload.playlistId); const item=message.payload.item; const key=item.provider==="netease"?`${item.provider}:song:${item.originalId}`:`${item.provider}:song:${item.mid||item.url}`; const added=!playlist.tracks.some(track=>track.key===key); if(added) playlist.tracks.push({...item,key}); return {ok:true,data:{added,playlist:{...playlist,trackCount:playlist.tracks.length},trackKey:key}}; }
    if(message.action==="collection.removeFromPlaylist") { const playlist=demoPlaylists.find(item=>item.id===message.payload.playlistId); playlist.tracks=playlist.tracks.filter(item=>item.key!==message.payload.trackKey); return {ok:true,data:{removed:true,playlist:{...playlist,trackCount:playlist.tracks.length},trackKey:message.payload.trackKey}}; }
    if(message.action==="collection.playlistTracks") { const playlist=demoPlaylists.find(item=>item.id===message.payload.playlistId); const offset=message.payload.offset||0; const items=playlist.tracks.slice(offset,offset+(message.payload.limit||60)); return {ok:true,data:{playlist:{...playlist,trackCount:playlist.tracks.length},items,recordCount:playlist.tracks.length,hasMore:offset+items.length<playlist.tracks.length}}; }
    if(message.action==="netease.control") return {ok:true,data:{payload:{state:{status:"playing",position:24,duration:264,volume:50,title:"Fade",meta:"Alan Walker",queueLength:12}}}};
    if(message.action==="netease.library") return {ok:true,data:{payload:{data:message.payload.kind==="favorite"?{name:"我喜欢的音乐",id:"CED6453C885522F2FAFD0F2D7F2E2DC1",originalId:7686123390,trackCount:887}:{records:[{name:message.payload.kind==="created"?"夜间驾驶":"电影配乐收藏",id:"D374329FEAF49C2A6B1D17A7DCADA717",originalId:18128658255,trackCount:56,creatorNickName:"CloudMusic"}]}}}};
    if(message.action==="netease.playlistTracks") { const offset=Number(message.payload.offset)||0; const limit=Number(message.payload.limit)||40; return {ok:true,data:{payload:{data:demoTracks.slice(offset,offset+limit),recordCount:demoTracks.length}}}; }
    if(message.action==="netease.visualizer") { const frames=[[-72,-64,-55,-42,-31,-22,-28,-45,-61,-78],[-24,-31,-46,-62,-72,-58,-39,-25,-18,-33],[-58,-28,-19,-37,-64,-74,-51,-30,-41,-69]]; return {ok:true,data:message.payload.mode==="stop"?{available:false}:{available:true,bands:frames[visualFrame++%frames.length]}}; }
    if(message.action==="qq.playlistDetail") return {ok:true,data:{songTotalNum:2,songs:[{songName:"晴天",singerName:"周杰伦",songMid:"demo",songH5Url:"https://y.qq.com"},{songName:"夜曲",singerName:"周杰伦",songMid:"demo2",songH5Url:"https://y.qq.com"}]}};
    if(message.action?.endsWith(".search")) return {ok:true,data:message.action.startsWith("qq")?(message.payload.type==="playlist"?{playlists:[{dissName:"周杰伦精选",creatorName:"QQ 音乐",dissId:"123456",songCount:2}]}:{songs:[{songName:"晴天",singerName:"周杰伦",songMid:"demo",songH5Url:"https://y.qq.com"},{songName:"夜曲",singerName:"周杰伦",songMid:"demo2",songH5Url:"https://y.qq.com"}]}):message.payload.type==="playlist"?{payload:{playlists:[{name:"夜间驾驶",creatorNickName:"CloudMusic",trackCount:60,id:"D374329FEAF49C2A6B1D17A7DCADA717",originalId:"18128658255",visible:true}]}}:{payload:{songs:[{name:"晴天",artistName:"周杰伦",encryptedId:"0123456789abcdef0123456789abcdef",originalId:"186016",visible:true,playFlag:true},{name:"夜曲",artistName:"周杰伦",encryptedId:"abcdef0123456789abcdef0123456789",originalId:"185868",visible:true,playFlag:true},{name:"会员歌曲示例",artistName:"演示歌手",encryptedId:"22222222222222222222222222222222",originalId:"10002",visible:true,playFlag:false,songFee:1}]}}};
    return {ok:true,data:{}};
  }}};
</script>
<script src="../extension/floating.js"></script>
</body></html>
